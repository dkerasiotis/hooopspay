services:
  hooopspay:
    build: .
    container_name: hooopspay
    restart: unless-stopped
    ports:
      - "5002:5002"
    volumes:
      - hooopspay_data:/data
    environment:
      - PORT=5002
      - DB_PATH=/data/hooopspay.db
      - SESSION_SECRET=${SESSION_SECRET:?Λείπει το SESSION_SECRET — αντίγραψε το .env.example σε .env}
      - ADMIN_INITIAL_PASS=admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hooopspay_data:
    driver: local
